# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/brandalorian-dev/eureka-sysml"
authors = ["The Eureka SysML Authors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
sysml-model = { path = "crates/sysml-model", version = "0.0.1" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"
sysml-api-types = { path = "crates/sysml-api-types", version = "0.0.1" }
sysml-corpus = { path = "crates/sysml-corpus", version = "0.0.1" }
sysml-synth = { path = "crates/sysml-synth", version = "0.0.1" }
divan = "0.1"
wasm-bindgen = "0.2"
rowan = "0.17"
sysml-syntax = { path = "crates/sysml-syntax", version = "0.0.1" }
wasm-bindgen-test = "0.3"
expect-test = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
