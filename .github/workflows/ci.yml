name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # docs/specs/ is never committed. Fetch it from the pinned upstream URLs and
      # verify the checksums, using a cache keyed on the lock file.
      - name: Cache spec files
        uses: actions/cache@v6
        with:
          path: docs/specs
          key: specs-${{ hashFiles('specs.lock.json') }}

      - name: Fetch and verify specs
        run: python scripts/fetch_specs.py fetch

      - name: Check codegen schema assumptions
        run: python scripts/check_schema_assumptions.py

      - name: Check the library UUID oracle (ADR 0009)
        run: python scripts/check_uuid_oracle.py

      - name: Python script tests
        run: python -m unittest discover -s scripts/tests -v

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # Runs each benchmark once, so they keep compiling and working. Timings are not gated on
      # shared runners (ADR 0007); measure with `cargo bench -p sysml-bench`.
      - name: benchmarks (run once)
        # `--bench '*'` selects only the bench targets; `--benches` would rerun the lib tests.
        run: cargo test --workspace --bench '*'

      - name: wasm build
        run: cargo build --workspace --target wasm32-unknown-unknown

  # Runs every test as WebAssembly under Node and checks that the same tests pass as natively,
  # then builds the sysml-wasm package and calls it from JavaScript (step 1a.1, ADR 0010).
  wasm:
    name: Rust (wasm tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache spec files
        uses: actions/cache@v6
        with:
          path: docs/specs
          key: specs-${{ hashFiles('specs.lock.json') }}

      - name: Fetch and verify specs
        run: python scripts/fetch_specs.py fetch

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The test runner must be the exact version of the wasm-bindgen crate in Cargo.lock.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          v=$(python -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('Cargo.lock', 'rb'))['package'] if p['name'] == 'wasm-bindgen'))")
          echo "wasm-bindgen $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }},wasm-pack@0.15.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: tests, native (for the parity check)
        # `shell: bash` runs with -eo pipefail, so a failing cargo test fails the step despite `| tee`.
        # (Without it, GitHub runs `bash -e`, and the pipeline's status is tee's.)
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee native.log

      - name: tests, WebAssembly under Node
        # `shell: bash` runs with -eo pipefail, so a failing cargo test fails the step despite `| tee`.
        # (Without it, GitHub runs `bash -e`, and the pipeline's status is tee's.)
        shell: bash
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --workspace --locked --target wasm32-unknown-unknown --no-fail-fast 2>&1 | tee wasm.log

      # wasm-bindgen-test-runner silently skips plain #[test] functions ("no tests to run!").
      - name: the same tests pass natively and on WASM
        run: python scripts/check_wasm_parity.py native.log wasm.log

      - name: wasm-pack build of sysml-wasm
        run: wasm-pack build crates/sysml-wasm --target web --out-dir ../../target/wasm-pkg/sysml-wasm

      - name: smoke-test the package from JavaScript
        run: node scripts/smoke_wasm_pkg.mjs

  # Builds and tests with exactly the minimum Rust version that Cargo.toml declares, so a
  # dependency update that needs a newer compiler fails here instead of going unnoticed.
  msrv:
    name: Rust MSRV (test, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache spec files
        uses: actions/cache@v6
        with:
          path: docs/specs
          key: specs-${{ hashFiles('specs.lock.json') }}

      - name: Fetch and verify specs
        run: python scripts/fetch_specs.py fetch

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['rust-version'])")
          echo "Declared minimum Rust version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # rust-toolchain.toml pins `stable`; RUSTUP_TOOLCHAIN takes precedence over it.
      - name: test
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          cargo --version
          cargo test --workspace --locked

      - name: wasm build
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo build --workspace --locked --target wasm32-unknown-unknown

  # CycloneDX SBOMs of the shipped crates for each shipped target (PROJECT_PLAN §4.8, ADR 0008),
  # checked against Cargo metadata and Cargo.lock, and kept as a build artifact. Releases will
  # attach and sign them.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.10

      - name: Generate and check SBOMs
        run: python scripts/sbom.py --out sbom

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error

  licenses-and-advisories:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No spec material committed
        run: |
          if git ls-files docs/specs | grep -q .; then
            echo "::error::Files under docs/specs/ must never be committed:"; git ls-files docs/specs; exit 1
          fi
